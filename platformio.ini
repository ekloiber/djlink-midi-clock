; Arduino-Pico (earlephilhower) core via the community PlatformIO platform.
; Board ID: verify with `pio boards rp2350` — see docs/bringup.md.

[platformio]
default_envs = feather_rp2350

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board = adafruit_feather_rp2350_hstx
monitor_speed = 115200
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
build_flags =
    -O2
    -Wall

; Default: MIDI clock on 5-pin DIN (MIDI FeatherWing, Serial1).
[env:feather_rp2350]

; Adds a class-compliant USB-MIDI output alongside DIN. Uses the Adafruit
; TinyUSB stack bundled with Arduino-Pico; USB serial debug still works.
[env:feather_rp2350_usbmidi]
build_flags =
    ${env.build_flags}
    -DUSE_TINYUSB
    -DENABLE_USB_MIDI=1
